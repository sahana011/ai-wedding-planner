<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Wedding Planner | King of Cards</title>
<meta name="description" content="Plan your entire wedding in minutes: a personalised budget, day-by-day plan and invitations from King of Cards.">
<meta property="og:title" content="King of Cards AI Wedding Planner (prototype)">
<meta property="og:description" content="Plan your wedding budget in minutes, with vendors matched to your budget.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Brand tokens — PLACEHOLDERS. Swap for the live kingofcards.in theme values (settings_data.json). */
:root {
  --ink: #1C2826; --muted: #56676A; --line: #D6DFDD; --line-2: #E6ECEA;
  --bg: #F2F5F4; --paper: #FFFFFF; --tint: #E8F0EE;
  --peacock: #0E4A47; --peacock-2: #15625E; --on-peacock: #FFFFFF;
  --marigold: #D99A1E; --marigold-soft: #FBF1DC;
  --kumkum: #A3293B; --kumkum-soft: #F8E6E8;
  --good: #2D7A4F; --good-soft: #E3F2E8; --warn: #A86A12; --warn-soft: #FBEFD9;
  --radius: 10px; --radius-lg: 18px;
  --display: 'Marcellus', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --ui: 'Figtree', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --shadow: 0 1px 2px rgba(20, 40, 38, .06), 0 6px 20px rgba(20, 40, 38, .06);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E6EEEC; --muted: #A2B3B1; --line: #33413F; --line-2: #2A3634;
    --bg: #121A19; --paper: #1A2423; --tint: #1F2E2C;
    --peacock: #5FB3AA; --peacock-2: #7CC6BD; --on-peacock: #0C1716;
    --marigold: #E7B24A; --marigold-soft: #33291A;
    --kumkum: #E0707F; --kumkum-soft: #3A2327;
    --good: #6CC592; --good-soft: #1D3226; --warn: #E3A94D; --warn-soft: #362B18;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  --ink: #E6EEEC; --muted: #A2B3B1; --line: #33413F; --line-2: #2A3634;
  --bg: #121A19; --paper: #1A2423; --tint: #1F2E2C;
  --peacock: #5FB3AA; --peacock-2: #7CC6BD; --on-peacock: #0C1716;
  --marigold: #E7B24A; --marigold-soft: #33291A;
  --kumkum: #E0707F; --kumkum-soft: #3A2327;
  --good: #6CC592; --good-soft: #1D3226; --warn: #E3A94D; --warn-soft: #362B18;
}
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.55; font-variant-numeric: tabular-nums; }
img { max-width: 100%; }
a { color: var(--peacock); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.15; margin: 0 0 .5em; letter-spacing: .005em; }
h1 { font-size: clamp(2.2rem, 5.2vw, 3.6rem); }
h2 { font-size: clamp(1.6rem, 3vw, 2.15rem); }
h3 { font-size: 1.3rem; }
p { margin: 0 0 1em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 1140px; margin: 0 auto; padding: 0 20px; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.tiny { font-size: .8rem; }

/* Prototype banner */
.proto { background: #1C2826; color: #F2F5F4; font-size: .82rem; }
.proto .wrap { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding-top: 6px; padding-bottom: 6px; }
.proto button { background: none; border: 1px solid currentColor; border-radius: 99px; color: inherit; padding: 2px 10px; cursor: pointer; font-size: .78rem; white-space: nowrap; }

/* Store header stand-in */
.site { background: var(--paper); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.site .wrap { display: flex; align-items: center; gap: 24px; height: 64px; }
.brand { font-family: var(--display); font-size: 1.35rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.site nav { display: flex; gap: 20px; margin-left: auto; font-size: .92rem; }
.site nav a { color: var(--muted); text-decoration: none; }
.site nav a[aria-current] { color: var(--peacock); font-weight: 600; }
@media (max-width: 760px) { .site nav a:not([aria-current]) { display: none; } .hide-sm { display: none; } }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 99px; border: 1px solid var(--peacock); background: var(--peacock); color: var(--on-peacock); padding: 12px 24px; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 48px; transition: background .15s; }
.btn:hover { background: var(--peacock-2); }
.btn.ghost { background: transparent; color: var(--peacock); }
.btn.ghost:hover { background: var(--tint); }
.btn.quiet { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.sm { padding: 6px 14px; min-height: 36px; font-size: .9rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--peacock); text-decoration: underline; cursor: pointer; font-weight: 600; }

/* Jharokha arch — the one signature shape */
.arch { background: var(--paper); border: 1px solid var(--line); border-radius: 50% 50% var(--radius-lg) var(--radius-lg) / 120px 120px var(--radius-lg) var(--radius-lg); box-shadow: var(--shadow); position: relative; }
.arch::before { content: ''; position: absolute; inset: 8px; border: 1px solid var(--line-2); border-radius: 50% 50% 12px 12px / 112px 112px 12px 12px; pointer-events: none; }
.arch-inner { position: relative; padding: 76px 28px 28px; }

/* Landing */
.hero { padding: 56px 0 40px; }
.hero .wrap { display: grid; grid-template-columns: 1.1fr .9fr; gap: 56px; align-items: center; }
.hero p.lead { font-size: 1.15rem; color: var(--muted); max-width: 34em; }
.hero .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin: 28px 0 14px; }
.trust { font-size: .92rem; color: var(--muted); }
.sample h3 { text-align: center; margin-bottom: 2px; }
.sample .sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 18px; }
.sample .big { text-align: center; font-size: 2rem; font-weight: 700; letter-spacing: -.01em; }
.sample .range { text-align: center; color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
.minibars { display: grid; gap: 8px; }
.minibar { display: grid; grid-template-columns: 1fr 64px; gap: 10px; font-size: .85rem; align-items: center; }
.minibar .t { position: relative; }
.minibar .t span { position: relative; z-index: 1; padding-left: 8px; }
.minibar .t i { position: absolute; inset: 0 auto 0 0; background: var(--tint); border-radius: 4px; }
.minibar b { text-align: right; font-weight: 600; }
.tag { display: inline-block; font-size: .75rem; padding: 2px 10px; border-radius: 99px; background: var(--marigold-soft); color: var(--warn); font-weight: 600; }
.band { padding: 56px 0; }
.band.alt { background: var(--paper); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.steps3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; counter-reset: s; list-style: none; padding: 0; margin: 28px 0 0; }
.steps3 li { counter-increment: s; border-top: 2px solid var(--peacock); padding-top: 16px; }
.steps3 li::before { content: counter(s); font-family: var(--display); font-size: 2rem; color: var(--peacock); display: block; line-height: 1; margin-bottom: 8px; }
.steps3 h3 { font-size: 1.2rem; }
.gets { columns: 2; column-gap: 48px; padding: 0; list-style: none; margin: 20px 0 0; }
.gets li { break-inside: avoid; padding: 12px 0 12px 28px; border-bottom: 1px solid var(--line-2); position: relative; }
.gets li::before { content: ''; position: absolute; left: 4px; top: 21px; width: 10px; height: 10px; border: 2px solid var(--marigold); border-radius: 50% 50% 2px 2px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 56px; align-items: start; }
details.faq { border-bottom: 1px solid var(--line); padding: 14px 0; }
details.faq summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; gap: 16px; }
details.faq summary::after { content: '+'; color: var(--peacock); font-size: 1.3rem; line-height: 1; }
details.faq[open] summary::after { content: '−'; }
details.faq p { margin: 10px 0 0; color: var(--muted); }
.cta-band { text-align: center; }
.resume { background: var(--marigold-soft); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }

@media (max-width: 880px) {
  .hero .wrap, .split { grid-template-columns: 1fr; gap: 32px; }
  .steps3 { grid-template-columns: 1fr; gap: 24px; }
  .gets { columns: 1; }
  .hero { padding-top: 32px; }
}

/* Planner */
.planner { padding: 28px 0 80px; }
.planner .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; }
.progress { grid-column: 1 / -1; }
.progress ol { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
.progress li button { all: unset; display: block; cursor: pointer; width: 100%; }
.progress li .bar { height: 4px; border-radius: 4px; background: var(--line); display: block; }
.progress li.done .bar { background: var(--peacock); }
.progress li.now .bar { background: var(--marigold); }
.progress li .lbl { display: block; font-size: .78rem; color: var(--muted); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress li.now .lbl { color: var(--ink); font-weight: 600; }
.progress li button[disabled] { cursor: default; }
.stepcard { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 32px; box-shadow: var(--shadow); }
.stepcard .kicker { color: var(--muted); font-size: .9rem; margin-bottom: 4px; }
.stepcard h2 { margin-bottom: 6px; }
.stepcard .help { color: var(--muted); margin-bottom: 24px; max-width: 40em; }
.q { margin: 0 0 26px; border: 0; padding: 0; min-width: 0; }
.q > legend, .q > label.ql { font-weight: 600; margin-bottom: 10px; display: block; padding: 0; }
.q .hint { color: var(--muted); font-size: .875rem; margin: -4px 0 10px; }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.opts.wide { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: block; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; background: var(--paper); min-height: 48px; height: 100%; transition: border-color .12s, background .12s; }
.opt span b { display: block; font-weight: 600; }
.opt span small { display: block; color: var(--muted); font-size: .82rem; margin-top: 2px; line-height: 1.35; }
.opt input:checked + span { border-color: var(--peacock); background: var(--tint); box-shadow: inset 0 0 0 1px var(--peacock); }
.opt input:focus-visible + span { outline: 3px solid var(--marigold); outline-offset: 2px; }
.opt input:disabled + span { opacity: .45; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.chip span { display: inline-block; border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; background: var(--paper); font-size: .92rem; min-height: 40px; }
.chip input:checked + span { background: var(--peacock); border-color: var(--peacock); color: var(--on-peacock); }
.chip .pn { font-size: .72rem; font-weight: 700; margin-right: 8px; padding: 2px 8px; border-radius: 99px; background: rgba(0,0,0,.18); }
.chip input:focus-visible + span { outline: 3px solid var(--marigold); outline-offset: 2px; }
.chip input:disabled + span { opacity: .4; }
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: .92rem; }
.inp, select.inp { border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; background: var(--paper); min-height: 46px; width: 100%; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.range-wrap { display: grid; gap: 8px; }
.range-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.range-val { font-size: 1.8rem; font-weight: 700; letter-spacing: -.01em; }
input[type=range] { width: 100%; accent-color: var(--peacock); height: 32px; }
.numbox { width: 120px; }
.note { border-left: 3px solid var(--marigold); background: var(--marigold-soft); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; font-size: .92rem; margin: 0 0 20px; }
.note.info { border-color: var(--peacock); background: var(--tint); }
.note.bad { border-color: var(--kumkum); background: var(--kumkum-soft); }
.err { color: var(--kumkum); font-size: .9rem; font-weight: 600; margin: 8px 0 0; }
.navrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line-2); }
.toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--peacock); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; background: var(--paper); flex-wrap: wrap; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span { display: block; padding: 6px 14px; border-radius: 99px; font-size: .9rem; }
.seg input:checked + span { background: var(--peacock); color: var(--on-peacock); }
.seg input:focus-visible + span { outline: 3px solid var(--marigold); }

/* Events timeline */
.days { display: grid; gap: 14px; }
.day { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); }
.day > header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-weight: 600; }
.ev { background: var(--paper); border-bottom: 1px solid var(--line-2); }
.ev:last-child { border-bottom: 0; border-radius: 0 0 var(--radius) var(--radius); }
.ev-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.ev-row .nm { font-weight: 600; }
.ev-row .meta { color: var(--muted); font-size: .85rem; }
.ev-row .acts { margin-left: auto; display: flex; gap: 6px; }
.iconbtn { border: 1px solid var(--line); background: var(--paper); border-radius: 99px; padding: 6px 12px; cursor: pointer; font-size: .85rem; min-height: 36px; }
.iconbtn:hover { border-color: var(--peacock); }
.ev-edit { padding: 4px 14px 18px; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
.addrow { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-top: 16px; }
.addrow .field { flex: 1 1 200px; }

/* Summary (arch) */
.summary { position: sticky; top: 88px; }
.summary h3 { text-align: center; font-size: 1.35rem; margin-bottom: 18px; }
.summary dl { margin: 0; display: grid; gap: 0; }
.summary .sr-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line-2); font-size: .94rem; }
.summary dt { color: var(--muted); }
.summary dd { margin: 0; font-weight: 600; text-align: right; }
.summary .est { margin-top: 16px; text-align: center; }
.summary .est .v { font-size: 1.5rem; font-weight: 700; }
.summary .est .l { color: var(--muted); font-size: .82rem; }
.msum { display: none; }
@media (max-width: 960px) {
  .planner .wrap { grid-template-columns: minmax(0, 1fr); }
  .summary { display: none; }
  .msum { display: block; position: sticky; top: 64px; z-index: 20; background: var(--paper); border-bottom: 1px solid var(--line); }
  .msum button { all: unset; display: flex; gap: 14px; width: 100%; box-sizing: border-box; padding: 10px 20px; font-size: .85rem; overflow-x: auto; white-space: nowrap; cursor: pointer; }
  .msum b { font-weight: 700; }
  .msum .open { padding: 0 20px 14px; }
  .progress ol { grid-template-columns: repeat(8, 1fr); }
  .progress li .lbl { display: none; }
  .progress li.now .lbl { display: block; position: absolute; }
  .progress { position: relative; padding-bottom: 20px; }
  .stepcard { padding: 22px 18px; }
  .row2 { grid-template-columns: 1fr; }
}

/* Generating */
.gen { min-height: 60vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; }
.gen ol { list-style: none; padding: 0; margin: 20px auto 0; text-align: left; display: inline-grid; gap: 10px; }
.gen li { color: var(--muted); display: flex; gap: 10px; align-items: center; }
.gen li.on { color: var(--ink); }
.gen li.ok { color: var(--ink); }
.gen li i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); display: inline-block; flex: none; }
.gen li.on i { border-color: var(--marigold); border-top-color: transparent; animation: spin .8s linear infinite; }
.gen li.ok i { border-color: var(--good); background: var(--good); }
@keyframes spin { to { transform: rotate(360deg); } }

/* Results */
.results { padding: 28px 0 120px; }
.res-head { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; margin-bottom: 28px; }
.res-head h1 { font-size: clamp(2rem, 4vw, 2.8rem); }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); margin: 18px 0; background: var(--paper); border-radius: var(--radius); overflow: hidden; }
.facts div { padding: 12px 14px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.facts dt { color: var(--muted); font-size: .8rem; }
.facts dd { margin: 0; font-weight: 600; }
.totalcard { padding: 24px; }
.totalcard .v { font-size: 2.3rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-weight: 700; font-size: .82rem; }
.badge.comfortable { background: var(--good-soft); color: var(--good); }
.badge.tight { background: var(--warn-soft); color: var(--warn); }
.badge.stretch, .badge.unrealistic { background: var(--kumkum-soft); color: var(--kumkum); }
.meter { position: relative; height: 40px; margin: 26px 0 8px; }
.meter .track { position: absolute; left: 0; right: 0; top: 16px; height: 8px; background: var(--line-2); border-radius: 8px; }
.meter .rng { position: absolute; top: 16px; height: 8px; background: var(--peacock); opacity: .35; border-radius: 8px; }
.meter .typ { position: absolute; top: 10px; width: 3px; height: 20px; background: var(--peacock); border-radius: 2px; transform: translateX(-1px); }
.meter .bud { position: absolute; top: 0; height: 40px; width: 0; border-left: 2px dashed var(--marigold); }
.meter .bud span { position: absolute; left: 6px; top: -4px; font-size: .75rem; font-weight: 700; color: var(--warn); white-space: nowrap; }
.meter-legend { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); }
.adjust { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) auto; gap: 14px; align-items: end; margin-bottom: 32px; position: sticky; top: 72px; z-index: 15; box-shadow: var(--shadow); }
.adjust .field label { font-size: .8rem; color: var(--muted); font-weight: 600; }
.adjust .inp { min-height: 40px; padding: 7px 10px; }
.res-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 32px; align-items: start; }
.sec { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 28px; margin-bottom: 24px; }
.sec > h2 { margin-bottom: 6px; }
.sec > .lead { color: var(--muted); margin-bottom: 20px; }
.ai-note { font-size: .8rem; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 16px; padding-top: 10px; }
.lines { display: grid; gap: 2px; }
.line { border-bottom: 1px solid var(--line-2); }
.line > button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) 120px 110px 24px; gap: 12px; align-items: center; width: 100%; padding: 11px 4px; cursor: pointer; }
.line > button:focus-visible { outline: 3px solid var(--marigold); }
.line .nm { font-weight: 600; }
.line .nm small { display: block; font-weight: 400; color: var(--muted); font-size: .8rem; }
.line .bar { height: 8px; background: var(--line-2); border-radius: 8px; position: relative; overflow: hidden; }
.line .bar i { position: absolute; inset: 0 auto 0 0; background: var(--peacock); border-radius: 8px; }
.line .bar i.p { background: var(--marigold); }
.line .v { text-align: right; font-weight: 700; }
.line .v small { display: block; font-weight: 400; color: var(--muted); font-size: .76rem; }
.line .chev { color: var(--muted); transition: transform .15s; }

  if (!d || !m) return { band: 'unknown', label: 'Season not set', mult: 1 };

}

/* ---------- Core calculation ---------- */
function compute(inp) {
  const d = DEST[inp.destId];
  const ci = d.idx, ri = d.roomIdx;
  const se = seasonOf(d, inp.month);
  const sm = se.mult;
  let wk = 1;
  if (inp.date) { const dow = new Date(inp.date + 'T12:00:00').getDay(); if (dow === 0 || dow === 6 || dow === 5) wk = 1.05; }
  const G = inp.guests;
  const evs = (inp.events || []).filter(e => EV[e.key]);
  const dest = inp.mode !== 'home';
  const days = Math.max(1, ...evs.map(e => e.day));
  const nights = days;
  const staying = Math.round(G * (dest ? inp.stayShare : inp.outShare));
  const personal = (inp.incJewellery ? (inp.jewelleryAmt || 0) : 0) + (inp.incOutfits ? (inp.outfitsAmt || 0) : 0);
  const celebration = inp.budget ? Math.max(0, inp.budget - personal) : null;
  let loadRaw = 0; evs.forEach(e => { loadRaw += e.share * EV[e.key].w; });
  const load = Math.max(0.35, loadRaw / PARAMS.eventLoadBaseline);
  const intensity = celebration != null ? celebration / (G * load * ci) : null;
  let budgetTier = 2;
  if (intensity != null) { budgetTier = 0; for (let i = 0; i < 6; i++) if (intensity >= TIER_MIN[i]) budgetTier = i; }
  const st = STYLES.find(s => s.id === inp.style);
  const baseTier = inp.forceTier != null ? inp.forceTier : (inp.style === 'fixed' && inp.fixedTier != null ? inp.fixedTier : (st && st.tier != null ? st.tier : budgetTier));
  const adj = inp.catAdj || {};
  const T = c => clamp(baseTier + (adj[c] || 0), 0, 5);
  const vs = VENUE_STYLE[inp.venueStyle || 'any'];
  const lines = [];
  const add = (key, typ, trace, extra) => { if (typ > 0) lines.push(Object.assign({ key, name: CATS[key], typ: round100(typ), tier: T(key), trace }, extra || {})); };
  const eg = e => Math.round(G * e.share);
  const nm = e => e.name || EV[e.key].name;

  // Venue
  let venue = 0; const vt = [];
  evs.forEach(e => {
    const w = e.share <= 0.3 ? 0.4 : Math.min(1, EV[e.key].w);
    const c = rt(R.venue, T('venue')) * w * ci * sm * wk * vs.f;
    venue += c; vt.push(`${nm(e)}: ${fmtShort(c)}`);
  });
  add('venue', venue, [`${tn(T('venue'))} venue rate ${inr(rt(R.venue, T('venue')))} per main event, scaled by event size`, `${d.name} cost index ${ci} × ${se.label.toLowerCase()} ×${sm}${vs.f !== 1 ? ` × ${vs.label.toLowerCase()} ×${vs.f}` : ''}`, ...vt]);

  // Rooms
  let stayIdx = T('stay') * 0.8; // 0 = 3-star … 4 = palace
  if (inp.venueStyle === 'palace' && dest) stayIdx = Math.max(stayIdx, 3);
  const occ = inp.occupancy || PARAMS.occupancy;
  const guestRooms = Math.ceil(staying / occ);
  const famRooms = dest ? 4 + Math.ceil(G / 100) : (staying > 0 ? 2 : 1);
  const crewRooms = dest ? 3 + T('stay') : 0;
  const rooms = guestRooms + famRooms + crewRooms;
  const roomRate = rt(R.room, stayIdx) * ri * sm * wk;
  const stayLabel = ['3-star', '4-star', '5-star', 'luxury', 'palace'][Math.round(stayIdx)];
  add('stay', rooms * nights * roomRate, [`${guestRooms} guest rooms (${staying} guests ÷ ${occ} per room) + ${famRooms} family rooms${crewRooms ? ` + ${crewRooms} crew rooms` : ''} = ${rooms} rooms`, `${rooms} rooms × ${nights} night${nights > 1 ? 's' : ''} × ${inr(roomRate)} (${stayLabel}, ${d.name}, ${se.label.toLowerCase()})`, 'Breakfast assumed included in the room rate']);

  // Food
  const dietF = { veg: 1, jain: 1.08, mixed: 1 + 0.2 * (inp.nonvegShare ?? 0.5), nonveg: 1.2 }[inp.diet || 'veg'];
  const dietL = { veg: 'vegetarian', jain: 'Jain', mixed: 'mixed veg and non-veg', nonveg: 'mostly non-veg' }[inp.diet || 'veg'];
  let food = 0; const ft = []; let meals = 0;
  evs.forEach(e => {
    const mf = MEAL_F[e.meal || EV[e.key].meal] ?? 0; if (!mf) return;
    const g = eg(e); const rate = rt(R.plate, T('food')) * mf * dietF * ci;
    let c = g * rate; if (T('food') >= 2 && (e.meal || EV[e.key].meal) === 'dinner') c *= 1.12;
    food += c; meals += g; ft.push(`${nm(e)}: ${g} guests × ${inr(rate)} ${MEAL_LABEL[e.meal || EV[e.key].meal].toLowerCase()}${T('food') >= 2 && (e.meal || EV[e.key].meal) === 'dinner' ? ' + live counters' : ''}`);
  });
  add('food', food, [`${tn(T('food'))} menus, ${dietL} (×${dietF.toFixed(2)}), ${d.name} index ${ci}`, ...ft], { meals });

  // Bar
  if (inp.alcohol) {
    let bar = 0; const bt = [];
    evs.filter(e => BAR_KEYS.includes(e.key) && (!inp.barMainOnly || ['reception', 'cocktail'].includes(e.key))).forEach(e => {
      const drinkers = Math.round(eg(e) * 0.5); const c = drinkers * rt(R.bar, T('food')) * ci + 15000 * ci;
      bar += c; bt.push(`${nm(e)}: ${drinkers} guests × ${inr(rt(R.bar, T('food')) * ci)} + licence`);
    });
    add('bar', bar, ['Half of attending guests assumed to drink; state licence fee per event (demo)', ...bt]);
  }

  // Décor and production
  const LV = { 1: 0.65, 2: 1, 3: 1.55 }; const LVN = { 1: 'simple', 2: 'elegant', 3: 'grand' };
  let decor = 0, prod = 0; const dt = [];
  evs.forEach(e => {
    const out = e.setting === 'outdoor';
    const c = rt(R.decor, T('decor')) * EV[e.key].dw * LV[e.decor || 2] * ci * sm * (out ? 1.1 : 1);
    decor += c; dt.push(`${nm(e)}: ${LVN[e.decor || 2]}${out ? ', outdoor' : ''}, ${fmtShort(c)}`);
    prod += rt(R.prod, T('decor')) * Math.min(1, EV[e.key].w) * ci * (out ? 1.2 : 1);
  });
  add('decor', decor, [`${tn(T('decor'))} décor base ${inr(rt(R.decor, T('decor')))} for a main event`, ...dt]);
  add('production', prod, ['Stage, sound, lighting, power back-up; outdoor events add generators and weather cover']);

  // Photography
  const photo = rt(R.photo, T('photo')) * days * Math.sqrt(ci) * sm * (G > 400 ? 1.25 : 1) + rt(R.album, T('photo')) + (dest ? 30000 + T('photo') * 20000 : 0);
  add('photo', photo, [`${tn(T('photo'))} team ${inr(rt(R.photo, T('photo')))} per day × ${days} day${days > 1 ? 's' : ''}${G > 400 ? ', larger team for 400+ guests' : ''}`, `Album and edits ${inr(rt(R.album, T('photo')))}${dest ? '; crew travel and stay included' : ''}`]);

  // Entertainment
  let ent = 0; const et = [];
  evs.forEach(e => {
    const acts = actsFor(e.key, Math.floor(T('ent') + 1e-9), dest); if (!acts.length) return;
    const c = acts.reduce((s, a) => s + rt(ACT[a].r, T('ent')) * Math.sqrt(ci), 0);
    ent += c; et.push(`${nm(e)}: ${acts.map(a => ACT[a].name.toLowerCase()).join(', ')}`);
  });
  add('ent', ent, et.length ? et : ['No entertainment added']);

  // Invitations and stationery (King of Cards)
  const hh = Math.ceil(G / (inp.hhSize || PARAMS.householdSize));
  const ds = inp.inviteType === 'digital' ? 1 : (inp.digitalShare || 0);
  const printedRaw = Math.round(hh * (1 - ds));
  const printed = printedRaw > 0 ? Math.max(100, printedRaw) : 0; // King of Cards minimum order is 100 invitations
  const tI = T('invites');
  const printedCost = printed * rt(R.card, tI) * 1.1;
  const digital = rt(R.digital, tI);
  const stationery = (dest ? (guestRooms + famRooms) * rt(R.insert, tI) : 0) + evs.length * rt(R.signage, tI);
  add('invites', printedCost + digital + stationery + hh * rt(R.tag, tI), [`${hh} households (${G} guests ÷ ${inp.hhSize || PARAMS.householdSize})`, `${printed} printed invitations${printed > printedRaw ? ' (King of Cards minimum order is 100)' : ''} × ${inr(rt(R.card, tI))} + 10% personalisation and envelopes`, `Digital invitation ${inr(digital)}`, `On-site stationery: ${dest ? 'welcome notes, itinerary cards and room inserts, ' : ''}menus and signage for ${evs.length} events`], { households: hh, printed, cardPrice: rt(R.card, tI) });

  // Hospitality and gifting
  const tH = T('hospitality');
  const hampers = (staying > 0 ? guestRooms + famRooms : 0) * rt(R.hamper, tH);
  const rgifts = hh * rt(R.rgift, tH);
  const desk = dest ? days * rt(R.desk, tH) : 0;
  add('hospitality', hampers + rgifts + desk, [`${staying > 0 ? guestRooms + famRooms : 0} welcome hampers × ${inr(rt(R.hamper, tH))}`, `${hh} return gifts × ${inr(rt(R.rgift, tH))}`, dest ? `Hospitality desk ${days} day${days > 1 ? 's' : ''} × ${inr(rt(R.desk, tH))}` : 'No hospitality desk for a home-city wedding']);

  // Transport
  const tT = T('transport');
  const cap = tT >= 3 ? 3 : 12;
  const tf = Math.pow(clamp(d.transfer / 45, 0.6, 3), 0.6);
  const vehicles = Math.ceil(staying / cap);
  const transfers = vehicles * 2 * rt(R.transfer, tT) * (dest ? tf : 0.6);
  const shuttles = Math.ceil(staying / 45) * evs.length * R.bus * (dest ? 0.5 : 0.3) * ci;
  const car = evs.some(e => EV[e.key].main) ? rt(R.car, tT) : 0;
  add('transport', transfers + shuttles + car, [`${vehicles} ${cap === 3 ? 'cars' : 'tempo travellers'} × 2 trips (arrival and departure)${dest ? `, ${d.transfer}-minute transfer from ${d.airport}` : ''}`, `Event shuttles for staying guests across ${evs.length} events`, car ? `Couple's car ${inr(car)}` : '']
    .filter(Boolean), { vehicles });

  // Beauty
  const tB = baseTier;
  const major = evs.filter(e => EV[e.key].w >= 0.35).length;
  const mehEv = evs.find(e => e.key === 'mehendi');
  const beauty = major * rt(R.look, tB) + Math.min(12, 4 + tB) * Math.ceil(major * 0.6) * rt(R.fam, tB) + (mehEv ? eg(mehEv) * 0.35 * rt(R.meh, tB) + rt(R.bridemeh, tB) : 0);
  add('beauty', beauty, [`Bride's look for ${major} events × ${inr(rt(R.look, tB))}`, `Family make-up for ${Math.min(12, 4 + tB)} people`, mehEv ? `Mehendi artists for about ${Math.round(eg(mehEv) * 0.35)} guests + bridal mehendi` : 'No mehendi event']);

  // Ceremonies
  const rit = evs.filter(e => EV[e.key].ritual);
  add('ceremonies', rit.length * rt(R.ritual, baseTier) * Math.sqrt(ci), [`${rit.length} ceremon${rit.length === 1 ? 'y' : 'ies'} × ${inr(rt(R.ritual, baseTier))}: officiant, materials and set-up`]);

  // Planner
  if (inp.planner === 'yes') {
    const managed = lines.filter(l => ['venue', 'food', 'decor', 'production', 'ent', 'transport', 'hospitality', 'bar'].includes(l.key)).reduce((s, l) => s + l.typ, 0);
    const fee = Math.max(rt(R.minfee, baseTier), rt(R.pfee, baseTier) * managed);
    add('planner', fee, [`Greater of ${inr(rt(R.minfee, baseTier))} minimum or ${Math.round(rt(R.pfee, baseTier) * 100)}% of managed spend (demo parameters)`]);
  }

  // Fees
  const outdoor = evs.filter(e => e.setting === 'outdoor').length;
  add('fees', evs.length * 5000 * ci + outdoor * 10000, [`Event permissions for ${evs.length} events`, outdoor ? `Sound permission for ${outdoor} outdoor event${outdoor > 1 ? 's' : ''}` : 'No outdoor events', 'Refundable venue deposit shown separately, not included']);

  // Contingency
  let cp = rt(R.cont, baseTier) + (dest ? 0.01 : 0) + (se.band === 'monsoon' ? 0.015 : 0) + (outdoor / Math.max(1, evs.length) > 0.5 ? 0.01 : 0);
  const sub = { typ: 0, min: 0, max: 0 };
  lines.forEach(l => { const s = SPREAD[l.key] || [0.85, 1.2]; l.min = round100(l.typ * s[0]); l.max = round100(l.typ * s[1]); sub.typ += l.typ; sub.min += l.min; sub.max += l.max; });
  const cont = { key: 'contingency', name: CATS.contingency, typ: round100(sub.typ * cp), min: round100(sub.min * cp), max: round100(sub.max * cp), tier: baseTier, trace: [`${Math.round(cp * 100)}% of the estimate${dest ? ', higher for destination weddings' : ''}${se.band === 'monsoon' ? ' and monsoon dates' : ''}`] };
  lines.push(cont);
  const totals = { typ: sub.typ + cont.typ, min: sub.min + cont.min, max: sub.max + cont.max };

  const personalLines = [];
  if (inp.incJewellery && inp.jewelleryAmt) personalLines.push({ key: 'jewellery', name: CATS.jewellery, typ: inp.jewelleryAmt, min: inp.jewelleryAmt, max: inp.jewelleryAmt, trace: ['Your amount, set aside before planning the celebration'] });
  if (inp.incOutfits && inp.outfitsAmt) personalLines.push({ key: 'outfits', name: CATS.outfits, typ: inp.outfitsAmt, min: inp.outfitsAmt, max: inp.outfitsAmt, trace: ['Your amount, set aside before planning the celebration'] });

  const maxDecor = Math.max(1, ...evs.map(e => e.decor || 2));
  const units = {
    plate: meals ? food / meals : rt(R.plate, T('food')) * ci,
    venueMain: rt(R.venue, T('venue')) * ci * sm * wk * vs.f,
    decorMain: rt(R.decor, T('decor')) * LV[maxDecor] * ci * sm,
    photoDay: rt(R.photo, T('photo')) * Math.sqrt(ci) * sm * (G > 400 ? 1.25 : 1),
    look: rt(R.look, tB), bridemeh: rt(R.bridemeh, tB),
    dj: rt(ACT.dj.r, T('ent')) * Math.sqrt(ci), choreo: rt(ACT.choreo.r, T('ent')) * Math.sqrt(ci),
    ritual: rt(R.ritual, baseTier) * Math.sqrt(ci), room: roomRate
  };
  let state = null, gap = 0;
  if (celebration != null) {
    if (celebration >= totals.typ) state = 'comfortable';
    else if (celebration >= totals.min) state = 'tight';
    else if (celebration >= totals.min * 0.7) state = 'stretch';
    else state = 'unrealistic';
    gap = celebration - totals.typ;
  }
  return {
    dest: d, season: se, days, nights, staying, rooms, guestRooms, famRooms, crewRooms, roomRate, stayLabel, households: hh, printed,
    cardPrice: rt(R.card, tI), meals, vehicles, lines, personalLines, totals, personal, celebration, budget: inp.budget || null,
    intensity, load, budgetTier, tier: baseTier, tierName: tn(baseTier), state, gap, deposit: round100(venue * 0.2),
    catTier: Object.fromEntries(Object.keys(CATS).map(k => [k, T(k)])), paramsVersion: PARAMS.version, units
  };
}

/* Priorities and fit.
   1. Priority areas sit +0.75 of a style level above the rest; the "save" area sits one level below.
   2. "Match my budget": solve (bisection) for the style level whose typical estimate uses about 97%
      of the celebration budget, capped at one level above the spend class. Explicit styles are used as chosen. */
function planWithPriorities(inp) {
  const adj = Object.assign({}, inp.catAdj || {});
  (inp.priorities || []).forEach(p => PRIO[p] && PRIO[p].cats.forEach(c => { adj[c] = (adj[c] || 0) + 0.75; }));
  if (inp.save && PRIO[inp.save]) PRIO[inp.save].cats.forEach(c => { adj[c] = (adj[c] || 0) - 1; });
  let cur = Object.assign({}, inp, { catAdj: adj, forceTier: null });
  let plan = compute(cur);
  let fit = null;
  if ((inp.style || 'match') === 'match' && inp.budget) {
    const classTier = plan.budgetTier;
    const target = plan.celebration * 0.97;
    const at = t => compute(Object.assign({}, cur, { forceTier: t }));
    let hi = Math.min(5, classTier + 1), lo = 0, chosen;
    if (at(hi).totals.typ <= target) chosen = hi;
    else if (at(0).totals.typ > target) chosen = 0;
    else { for (let i = 0; i < 14; i++) { const m = (lo + hi) / 2; if (at(m).totals.typ <= target) lo = m; else hi = m; } chosen = lo; }
    chosen = Math.floor(chosen * 20) / 20;
    cur = Object.assign({}, cur, { forceTier: chosen }); plan = at(chosen);
    if (Math.round(chosen) < classTier) fit = { classTier, chosen, classNeed: at(classTier).totals.typ };
  }
  plan.priorityCats = (inp.priorities || []).map(p => ({ prio: p, label: PRIO[p].label, level: tn(plan.catTier[PRIO[p].cats[0]]) }));
  plan.effInp = cur; plan.fit = fit;
  return plan;
}

/* What a one-level upgrade of an area would cost (for "If you want to spend more"). */
function upgradeOptions(plan) {
  const out = [];
  Object.keys(PRIO).forEach(p => {
    const cats = PRIO[p].cats; if (cats.some(c => plan.catTier[c] >= 5)) return;
    const v = JSON.parse(JSON.stringify(plan.effInp)); v.catAdj = v.catAdj || {};
    cats.forEach(c => { v.catAdj[c] = (v.catAdj[c] || 0) + 1; });
    const tp = compute(v); const delta = tp.totals.typ - plan.totals.typ;
    if (delta > 0) out.push({ prio: p, label: PRIO[p].label, from: tn(plan.catTier[cats[0]]), to: tn(tp.catTier[cats[0]]), delta, inp: v });
  });
  return out.sort((a, b) => a.delta - b.delta);
}

/* Compromise ladder: engine re-runs each lever; never lowers a unit rate. */
function compromises(inp, plan) {
  const base = plan.totals.typ; const pr = new Set((inp.priorities || []).flatMap(p => PRIO[p].cats));
  const L = [];
  const tryL = (id, label, detail, touches, mod) => {
    if (touches.some(c => pr.has(c))) return;
    const v = mod(JSON.parse(JSON.stringify(plan.effInp || inp)));
    if (!v) return;
    const vp = compute(v); const saving = base - vp.totals.typ;
    if (saving > base * 0.01) L.push({ id, label, detail, saving, mod });
  };
  const pre = ['mehendi', 'haldi', 'sangeet', 'welcome', 'engagement', 'cocktail', 'pool', 'brunch', 'roka', 'tilak'];
  tryL('preshare', 'Invite fewer guests to pre-wedding events', 'Keep 60% of guests at pre-wedding events; everyone still attends the wedding and reception.', ['food'], v => { let ch = false; v.events.forEach(e => { if (pre.includes(e.key) && e.share > 0.6) { e.share = 0.6; ch = true; } }); return ch ? v : null; });
  tryL('combine', 'Hold mehendi and haldi on the same day', 'A morning haldi and an afternoon mehendi share one day, saving a night of rooms and a day of crew.', [], v => {
    const m = v.events.find(e => e.key === 'mehendi'), h = v.events.find(e => e.key === 'haldi');
    if (!m || !h || m.day === h.day) return null; h.day = m.day; h.slot = 'Morning';
    const used = [...new Set(v.events.map(e => e.day))].sort((a, b) => a - b); v.events.forEach(e => { e.day = used.indexOf(e.day) + 1; }); return v;
  });
  tryL('offseason', 'Move to a shoulder-season month', 'Shoulder-season dates cost less for venues, rooms and décor, with milder weather than the off-season.', [], v => {
    const d = DEST[v.destId]; const cur = seasonOf(d, v.month).mult;
    for (let k = 1; k <= 11; k++) { const m = ((v.month - 1 + k) % 12) + 1; const s = seasonOf(d, m); if (s.band === 'shoulder' && s.mult < cur) { if (m < v.month) v.year = (v.year || 2027) + 1; v.month = m; v.date = ''; return v; } }
    return null;
  });
  tryL('occupancy', 'Three guests per room for friends and cousins', 'Share larger rooms for younger guests; family rooms stay as they are.', ['stay'], v => { if (v.mode === 'home' || (v.occupancy || 2) >= 3) return null; v.occupancy = 3; return v; });
  tryL('decorlite', 'Lighter décor for pre-wedding events', 'Keep the wedding and reception as planned; simpler set-ups for the rest.', ['decor'], v => { let ch = false; v.events.forEach(e => { if (!EV[e.key].main && e.key !== 'reception' && (e.decor || 2) > 1) { e.decor = 1; ch = true; } }); return ch ? v : null; });
  tryL('digital', 'Digital invitations for the outer circle', 'Send printed King of Cards invitations to close family and digital ones to 40% of households.', ['invites'], v => { if ((v.digitalShare || 0) >= 0.4 || v.inviteType === 'digital') return null; v.digitalShare = 0.4; return v; });
  tryL('barmain', 'Serve the bar at the main evening events only', 'Keep drinks for the cocktail and reception.', ['food'], v => { if (!v.alcohol || v.barMainOnly) return null; v.barMainOnly = true; return v; });
  tryL('style', 'A simpler style where you have not set priorities', 'Areas you did not mark as priorities move one level simpler.', [], v => {
    const adj = v.catAdj || {}; Object.keys(CATS).forEach(c => { if (!pr.has(c)) adj[c] = (adj[c] || 0) - 1; }); v.catAdj = adj; return v;
  });
  tryL('guests', 'Trim the guest list by 15%', 'Every guest adds meals, rooms, transport and invitations.', [], v => { v.guests = Math.round(v.guests * 0.85); return v; });
  return L.sort((a, b) => b.saving - a.saving).slice(0, 5);
}

/* Destination alternatives for comparison */
function compareDestinations(inp, ids) {
  return ids.map(id => { const v = Object.assign({}, inp, { destId: id, mode: 'destination' }); if (DEST[id].home && !DEST[id].dest) v.mode = 'destination'; return { d: DEST[id], plan: planWithPriorities(v) }; });
}
function suggestDestinations(inp, n, region) {
  const all = DEST_LIST.filter(d => d.dest && d.id !== inp.destId && (!region || d.region === region));
  const res = all.map(d => ({ d, plan: planWithPriorities(Object.assign({}, inp, { destId: d.id, mode: 'destination' })) })).filter(r => r.d.maxGuests >= inp.guests);
  return res.sort((a, b) => a.plan.totals.typ - b.plan.totals.typ).slice(0, n || 3);
}

/* ---------- Formatting ---------- */
function inr(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function trimNum(s) { return s.replace(/\.0+$/, '').replace(/(\.\d*[1-9])0+$/, '$1'); }
function amt(n) {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n), sign = n < 0 ? '−' : '';
  if (a >= 1e7) return sign + '₹' + trimNum((a / 1e7).toFixed(2)) + ' crore';
  if (a >= 1e5) return sign + '₹' + trimNum((a / 1e5).toFixed(1)) + ' lakh';
  if (a >= 1000) return sign + '₹' + (Math.round(a / 1000) * 1000).toLocaleString('en-IN');
  return sign + inr(a);
}
function fmtShort(n) {
  if (n == null || isNaN(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e7) return '₹' + trimNum((a / 1e7).toFixed(2)) + 'Cr';
  if (a >= 1e5) return '₹' + trimNum((a / 1e5).toFixed(1)) + 'L';
  if (a >= 1000) return '₹' + trimNum((a / 1000).toFixed(0)) + 'k';
  return inr(a);
}

/* Minimal PDF writer: A4 pages, Helvetica / Helvetica-Bold (WinAnsi), text, wrapped paragraphs,
   simple tables and rules. No external libraries, so the download works offline. */
const PDFW = (function () {
  const W = 595.28, H = 841.89, M = 44;
  const clean = s => String(s == null ? '' : s)
    .replace(/₹\s?/g, 'Rs ').replace(/[\u2013\u2014]/g, '-').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"')
    .replace(/\u2026/g, '...').replace(/\u00A0/g, ' ').replace(/[^\x20-\x7E\u00A0-\u00FF]/g, '');
  const esc = s => clean(s).replace(/\\/g, '\\\\').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
  const cw = size => size * 0.5; // average Helvetica glyph width
  function wrap(text, size, width) {
    const words = clean(text).split(/\s+/); const lines = []; let cur = '';

    words.forEach(w => { if ((cur + ' ' + w).trim().length > max) { if (cur) lines.push(cur); cur = w; } else cur = (cur + ' ' + w).trim(); });
    if (cur) lines.push(cur); return lines.length ? lines : [''];
  }
  function build(blocks) {
    const pages = []; let ops = []; let y = H - M;
    const newPage = () => { if (ops.length) pages.push(ops.join('\n')); ops = []; y = H - M; };
    const need = h => { if (y - h < M + 20) newPage(); };
    const text = (x, yy, s, size, bold, color) => { ops.push(`BT ${color || '0.11 0.16 0.15'} rg /${bold ? 'F2' : 'F1'} ${size} Tf ${x.toFixed(2)} ${yy.toFixed(2)} Td (${esc(s)}) Tj ET`); };
    const rule = (yy, c) => ops.push(`${c || '0.84 0.87 0.86'} RG 0.6 w ${M} ${yy.toFixed(2)} m ${(W - M).toFixed(2)} ${yy.toFixed(2)} l S`);
    blocks.forEach(b => {
      if (b.t === 'title') { need(40); text(M, y - 22, b.s, 20, true, '0.055 0.29 0.278'); y -= 32; }
      else if (b.t === 'h') { need(34); y -= 8; text(M, y - 13, b.s, 13, true, '0.055 0.29 0.278'); y -= 20; rule(y + 2); y -= 4; }
      else if (b.t === 'sub') { need(20); text(M, y - 11, b.s, 10.5, true); y -= 16; }
      else if (b.t === 'p') { const size = b.size || 9.5; wrap(b.s, size, W - 2 * M).forEach(l => { need(size + 4); text(M, y - size, l, size, b.bold, b.color); y -= size + 3.5; }); y -= 3; }
      else if (b.t === 'row') {
        const size = b.size || 9.5; const cols = b.cols; const xs = b.xs; const widths = xs.map((x, i) => (i < xs.length - 1 ? xs[i + 1] : W - M) - x - 6);
        const wrapped = cols.map((c, i) => wrap(c, size, widths[i]));
        const h = Math.max(...wrapped.map(w => w.length)) * (size + 3) + 4; need(h);
        wrapped.forEach((ls, i) => ls.forEach((l, k) => text(xs[i], y - size - k * (size + 3), l, size, b.bold)));
        y -= h; if (b.line) rule(y + 2);
      }
      else if (b.t === 'gap') { y -= b.h || 8; }
    });
    newPage();
    const objs = [];
    objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
    objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
    objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
    const kids = [];
    pages.forEach((content, i) => {
      const footer = `BT 0.45 0.5 0.5 rg /F1 8 Tf ${M} 24 Td (${esc('King of Cards Wedding Planner  |  kingofcards.in  |  Estimates are planning ranges, not quotes.  |  Page ' + (i + 1) + ' of ' + pages.length)}) Tj ET`;
      const stream = content + '\n' + footer;
      const pid = 5 + i * 2, cid = 6 + i * 2; kids.push(pid + ' 0 R');
      objs[pid] = `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${cid} 0 R >>`;
      objs[cid] = `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`;
    });
    objs[2] = `<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${pages.length} >>`;
    let out = '%PDF-1.4\n'; const offs = [];
    for (let i = 1; i < objs.length; i++) { offs[i] = out.length; out += `${i} 0 obj\n${objs[i]}\nendobj\n`; }
    const xref = out.length;
    out += `xref\n0 ${objs.length}\n0000000000 65535 f \n` + offs.slice(1).map(o => String(o).padStart(10, '0') + ' 00000 n \n').join('');
    out += `trailer\n<< /Size ${objs.length} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
    const bytes = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) bytes[i] = out.charCodeAt(i) & 255;
    return bytes;
  }
  return { build, clean, W, M };
})();

/* ======================== VERIFY (OTP) ======================== */

function setEv(uid, f, v) { const ev = S.inp.events.find(x => x.uid === uid); if (ev) { ev[f] = v; S.inp.eventsEdited = true; } }

function onChange(e) {
